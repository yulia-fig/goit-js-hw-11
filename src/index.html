<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- Loader -->
    <div class="loader"></div>

    <!-- Форма пошуку -->
    <main>
      <form class="form">
        <label>
          <input
            type="text"
            name="search-text"
            placeholder="Search images..."
            required
          />
        </label>
        <button type="submit">Search</button>
      </form>
    </main>

    <!-- Галерея -->
    <ul class="gallery">
      <li><img src="image1.jpg" alt="Фото 1" /></li>
      <li><img src="image2.jpg" alt="Фото 2" /></li>
      <li><img src="image3.jpg" alt="Фото 3" /></li>
      <!-- додавайте скільки потрібно -->
    </ul>

    <script type="module" src="./main.js"></script>
  </body>
</html>
